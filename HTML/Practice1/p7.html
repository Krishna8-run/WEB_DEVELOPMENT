<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="black">
        <caption>Student Information</caption>
         <tr>
            <th rowspan="6">Info  </th>
            <th rowspan="2">Name </th>
            <th colspan="2">Address </th>
         </tr>
         <tr>
            <th>City</th>
            <th>House</th>
         </tr>
         <tr>
            <td>A</td>
            <td>Delhi</td>
            <td>1</td>
         </tr>
         <tr>
            <td>b</td>
            <td>Mumbai</td>
            <td>2</td>
         </tr>
         <tr>
            <td>C</td>
            <td>Kolkata</td>
            <td>3</td>
         </tr>
         <tr>
            <td>D</td>
            <td>Pune</td>
            <td>4</td>
         </tr>
    </table>
    <br>
    <form action="">
       <label for="nam">Name:</label>
       <input type="text" id="nam"/>
       <div>
          <label for="gender">Sex:</label>
          <input type="radio" id="Male" name="gender"value="Male">
          <label for="Male">male</label>
          <input type="radio" id="Female" name="gender" value="Female">
          <label for="Female">female</label>
       </div>
       <div>
            <label for="country">Country:</label>
            <select name="country" id="country">
                <option>Select an option</option>
                <option value="Nepal">nepal</option>
                <option value="India">india</option>
                <option value="America">america</option>
                <option value="Canada">canada</option>
            </select>
       </div>
       <div>
            <label for="message">Message:</label>
            <br>
            <textarea  id="message" name="message"  cols="30" rows="4"></textarea> 
       </div>
       <button>submit</button>
    </form>
    <br>
    <form action="link">
        <div>
            <label for="name">Name:</label>
            <input type="text"  value="Write your name" id="name" >
        </div>
        <br>
        <div>
            <label for="email">Email:</label>
            <input type="Email" id="email" value="Write your email">
        </div>
        <br>
        <div>
            <label for="message1" >Message1:</label>
            <br>
            <textarea id="message1" name="message1"  cols="40" rows="5">write message here</textarea>
        </div>
        <div>
           <label for="rate" >Rate us out of 5:</label>
           <br>
           <input type="radio" id="rate" name="rate" value="1" >
           <label for="rate" >1</label>
           <br>
           <input type="radio" id="rate" name="rate" value="2" >
           <label for="rate" >2</label>
           <br>
           <input type="radio" id="rate" name="rate" value="3" >
           <label for="rate" >3</label>
           <br>
           <input type="radio" id="rate" name="rate" value="4" >
           <label for="rate" >4</label>
            <br>
           <input type="radio" id="rate" name="rate" value="5" >
           <label for="rate" >5</label>
        </div>
        <label for="send"></label>
        <input type="text" id="send" value="Send your message!">
    </form>
</body>
</html>
